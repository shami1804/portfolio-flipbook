<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Flipbook</title>

    <style>
        body {
            margin: 0;
            background: #f7f5f0;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h2 {
            color: #174f42;
            margin-top: 30px;
        }

        #status {
            margin: 20px;
            padding: 15px;
            color: #333;
        }

        #book {
            width: 500px;
            height: 700px;
            margin: 30px auto;
        }

        .page {
            background: white;
            overflow: hidden;
        }

        .page canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<h2>My Portfolio</h2>

<div id="status">Starting...</div>

<div id="book"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>

async function start() {

    const status = document.getElementById("status");

    try {

        status.innerHTML = "PDF.js loaded: " + typeof pdfjsLib;

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        status.innerHTML += "<br>Loading PDF...";

        const pdf = await pdfjsLib
            .getDocument("portfolio.pdf")
            .promise;

        status.innerHTML +=
            "<br>PDF loaded successfully — " +
            pdf.numPages +
            " pages.";

        const pages = [];

        for (let i = 1; i <= pdf.numPages; i++) {

            status.innerHTML =
                "Rendering page " + i + " of " + pdf.numPages + "...";

            const pdfPage = await pdf.getPage(i);

            const viewport =
                pdfPage.getViewport({ scale: 1.2 });

            const canvas =
                document.createElement("canvas");

            const context =
                canvas.getContext("2d");

            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await pdfPage.render({
                canvasContext: context,
                viewport: viewport
            }).promise;

            const page = document.createElement("div");

            page.className = "page";

            page.appendChild(canvas);

            pages.push(page);
        }

        status.innerHTML =
            "Pages rendered. Creating flipbook...";

        console.log("PageFlip:", typeof St);

        const flipbook = new St.PageFlip(
            document.getElementById("book"),
            {
                width: 500,
                height: 700,
                size: "stretch",
                minWidth: 280,
                maxWidth: 700,
                minHeight: 400,
                maxHeight: 900,
                showCover: true,
                drawShadow: true,
                flippingTime: 700,
                mobileScrollSupport: true
            }
        );

        flipbook.loadFromHTML(pages);

        status.innerHTML =
            "✓ Flipbook loaded successfully!";

    } catch (error) {

        console.error(error);

        status.innerHTML =
            "<strong>ERROR:</strong><br><br>" +
            error.name +
            "<br>" +
            error.message;

    }

}

start();

</script>

</body>
</html>
