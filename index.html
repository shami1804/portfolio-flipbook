<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shamiha Sellamuthu — Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #f7f5f0;
            font-family: Arial, sans-serif;
            color: #333;
            overflow-x: hidden;
        }

        .viewer {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .title {
            font-size: 18px;
            margin-bottom: 20px;
            color: #174f42;
        }

        #loading {
            font-size: 15px;
            margin-bottom: 20px;
        }

        #book {
            width: min(90vw, 1000px);
            height: min(75vh, 720px);
        }

        .page {
            background: white;
            overflow: hidden;
        }

        .page canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 22px;
        }

        button {
            border: none;
            background: #174f42;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.85;
        }

        #pageNumber {
            min-width: 90px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 700px) {

            .viewer {
                padding: 15px 8px;
            }

            .title {
                font-size: 15px;
            }

            #book {
                width: 94vw;
                height: 68vh;
            }

            button {
                padding: 8px 12px;
            }
        }
    </style>
</head>

<body>

<div class="viewer">

    <div class="title">
        Flip through my portfolio
    </div>

    <div id="loading">
        Loading portfolio...
    </div>

    <div id="book"></div>

    <div class="controls">

        <button id="prev">
            ← Previous
        </button>

        <span id="pageNumber">
            Page 1
        </span>

        <button id="next">
            Next →
        </button>

    </div>

</div>


<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- PageFlip -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>


<script>

    const PDF_URL = "portfolio.pdf";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


    async function createFlipbook() {

        const loading = document.getElementById("loading");
        const bookElement = document.getElementById("book");
        const pageNumber = document.getElementById("pageNumber");

        try {

            // Load PDF
            const pdf = await pdfjsLib.getDocument(PDF_URL).promise;

            console.log("PDF loaded:", pdf.numPages, "pages");


            const pageElements = [];


            // Render every PDF page
            for (let i = 1; i <= pdf.numPages; i++) {

                const pdfPage = await pdf.getPage(i);

                const viewport = pdfPage.getViewport({
                    scale: 1.5
                });


                const canvas = document.createElement("canvas");

                const context = canvas.getContext("2d");

                canvas.width = viewport.width;
                canvas.height = viewport.height;


                await pdfPage.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;


                const pageDiv = document.createElement("div");

                pageDiv.className = "page";

                pageDiv.appendChild(canvas);

                pageElements.push(pageDiv);
            }


            // Hide loading text
            loading.style.display = "none";


            // Create flipbook
            const pageFlip = new St.PageFlip(
                bookElement,
                {
                    width: 500,
                    height: 700,

                    size: "stretch",

                    minWidth: 280,
                    maxWidth: 600,

                    minHeight: 400,
                    maxHeight: 800,

                    showCover: true,

                    drawShadow: true,

                    flippingTime: 700,

                    usePortrait: true,

                    mobileScrollSupport: true
                }
            );


            // Load pages
            pageFlip.loadFromHTML(pageElements);


            // Page counter
            pageFlip.on("flip", function(e) {

                pageNumber.textContent =
                    "Page " + (e.data + 1) + " / " + pdf.numPages;

            });


            // Buttons
            document.getElementById("next").addEventListener(
                "click",
                function() {
                    pageFlip.flipNext();
                }
            );


            document.getElementById("prev").addEventListener(
                "click",
                function() {
                    pageFlip.flipPrev();
                }
            );


            pageNumber.textContent =
                "Page 1 / " + pdf.numPages;


        } catch (error) {

            console.error(error);

            loading.textContent =
                "Unable to load the portfolio.";

        }

    }


    createFlipbook();

</script>

</body>
</html>
