<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shamiha Sellamuthu — Portfolio</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }


        body {

            background: #f7f5f0;

            font-family: Arial, sans-serif;

            color: #333;

            overflow-x: hidden;
        }


        /* ================================
           MAIN VIEWER
        ================================= */

        .viewer {

            width: 100%;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 25px 15px;
        }


        /* ================================
           LOADING
        ================================= */

        #status {

            font-size: 14px;

            color: #555;

            margin-bottom: 15px;
        }


        /* ================================
           FLIPBOOK
        ================================= */

        #book {

            width: min(90vw, 1000px);

            height: min(75vh, 720px);

            touch-action: pan-y;

            user-select: none;

            -webkit-user-select: none;
        }


        /* ================================
           PAGE
        ================================= */

        .page {

            position: relative;

            background: #fff;

            overflow: hidden;

            border-radius: 1px;
        }


        /* ================================
           PDF CANVAS
        ================================= */

        .page canvas {

            width: 100%;

            height: 100%;

            display: block;

            pointer-events: none;
        }


        /* ================================
           CLICKABLE PAGE 7 LINK
        ================================= */

        .clickable-link {

            position: absolute;

            z-index: 20;

            /*
             * Area of the "Be" link
             * on page 7
             */

            left: 0%;

            top: 55%;

            width: 18%;

            height: 8%;

            display: block;

            background: transparent;

            cursor: pointer;

            text-decoration: none;

            pointer-events: auto;
        }


        /* ================================
           CONTROLS
        ================================= */

        .controls {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 15px;

            margin-top: 20px;
        }


        button {

            border: none;

            background: #174f42;

            color: white;

            padding: 9px 17px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;

            transition:
                opacity 0.2s ease,
                transform 0.15s ease;
        }


        button:hover {

            opacity: 0.88;
        }


        button:active {

            transform: scale(0.97);
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 700px) {

            .viewer {

                padding: 15px 8px;
            }


            #book {

                width: 94vw;

                height: 68vh;
            }


            button {

                padding: 8px 12px;
            }

        }

    </style>

</head>


<body>


<div class="viewer">


    <!-- ================================
         LOADING
    ================================= -->

    <div id="status">
        Loading portfolio...
    </div>


    <!-- ================================
         FLIPBOOK
    ================================= -->

    <div id="book"></div>


    <!-- ================================
         CONTROLS
    ================================= -->

    <div class="controls">


        <button
            id="prev"
            type="button">

            ← Previous

        </button>


        <button
            id="next"
            type="button">

            Next →

        </button>


    </div>


</div>



<!-- =====================================
     PDF.JS
===================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>



<!-- =====================================
     PAGE FLIP
===================================== -->

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>



<script>


async function start() {


    const status =
        document.getElementById("status");


    const bookElement =
        document.getElementById("book");


    const nextButton =
        document.getElementById("next");


    const prevButton =
        document.getElementById("prev");



    try {


        /* =================================
           PDF.JS WORKER
        ================================= */

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";



        /* =================================
           LOAD PDF
        ================================= */

        const pdf =
            await pdfjsLib
                .getDocument("portfolio.pdf")
                .promise;



        const pages = [];



        /* =================================
           CREATE EACH PDF PAGE
        ================================= */

        for (
            let i = 1;
            i <= pdf.numPages;
            i++
        ) {


            const pdfPage =
                await pdf.getPage(i);



            /* -----------------------------
               PDF VIEWPORT
            ----------------------------- */

            const viewport =
                pdfPage.getViewport({
                    scale: 1.2
                });



            /* -----------------------------
               CANVAS
            ----------------------------- */

            const canvas =
                document.createElement("canvas");


            const context =
                canvas.getContext("2d");


            canvas.width =
                viewport.width;


            canvas.height =
                viewport.height;



            /* -----------------------------
               RENDER PDF
            ----------------------------- */

            await pdfPage.render({

                canvasContext:
                    context,

                viewport:
                    viewport

            }).promise;



            /* -----------------------------
               PAGE ELEMENT
            ----------------------------- */

            const page =
                document.createElement("div");


            page.className =
                "page";



            /* =============================
               FRONT + BACK COVER
            ============================= */

            if (
                i === 1 ||
                i === pdf.numPages
            ) {

                page.dataset.density =
                    "hard";

            }


            /* =============================
               INSIDE PAGES
            ============================= */

            else {

                page.dataset.density =
                    "soft";

            }



            /* -----------------------------
               ADD CANVAS
            ----------------------------- */

            page.appendChild(canvas);



            /* =================================
               PAGE 7 CLICKABLE LINK
            ================================= */

            if (i === 7) {


                const link =
                    document.createElement("a");


                link.className =
                    "clickable-link";


                link.href =
                    "https://shami1804.github.io/portfolio-flipbook/";


                link.target =
                    "_blank";


                link.rel =
                    "noopener noreferrer";



                /*
                 * Prevent the link click
                 * from becoming a page turn.
                 */

                link.addEventListener(
                    "pointerdown",
                    function(e) {

                        e.stopPropagation();

                    }
                );


                link.addEventListener(
                    "pointerup",
                    function(e) {

                        e.stopPropagation();

                    }
                );


                link.addEventListener(
                    "mousedown",
                    function(e) {

                        e.stopPropagation();

                    }
                );


                link.addEventListener(
                    "mouseup",
                    function(e) {

                        e.stopPropagation();

                    }
                );


                link.addEventListener(
                    "click",
                    function(e) {

                        e.stopPropagation();

                    }
                );


                page.appendChild(link);

            }



            /* -----------------------------
               SAVE PAGE
            ----------------------------- */

            pages.push(page);

        }



        /* =================================
           HIDE LOADING
        ================================= */

        status.style.display =
            "none";



        /* =================================
           CREATE PAGE FLIP
        ================================= */

        const flipbook =
            new St.PageFlip(

                bookElement,

                {

                    width: 500,

                    height: 700,


                    size: "stretch",


                    minWidth: 280,

                    maxWidth: 600,


                    minHeight: 400,

                    maxHeight: 800,


                    /* -------------------------
                       DIARY COVER
                    ------------------------- */

                    showCover: true,


                    /* -------------------------
                       SHADOW
                    ------------------------- */

                    drawShadow: true,

                    maxShadowOpacity: 0.04,


                    /* -------------------------
                       ANIMATION
                    ------------------------- */

                    flippingTime: 520,


                    /* -------------------------
                       RESPONSIVE
                    ------------------------- */

                    usePortrait: true,


                    /* -------------------------
                       MOBILE
                    ------------------------- */

                    mobileScrollSupport: true,


                    /* -------------------------
                       MOUSE
                    ------------------------- */

                    useMouseEvents: true,


                    /* -------------------------
                       EASIER DRAG
                    ------------------------- */

                    swipeDistance: 20,


                    /* -------------------------
                       CLICK TO FLIP
                    ------------------------- */

                    disableFlipByClick: false

                }

            );



        /* =================================
           LOAD PDF PAGES
        ================================= */

        flipbook.loadFromHTML(pages);



        /* =================================
           NEXT BUTTON
        ================================= */

        nextButton.addEventListener(
            "click",
            function(e) {

                e.preventDefault();

                e.stopPropagation();


                /*
                 * Explicitly use the bottom
                 * corner for the animation.
                 */

                flipbook.flipNext("bottom");

            }
        );



        /* =================================
           PREVIOUS BUTTON
        ================================= */

        prevButton.addEventListener(
            "click",
            function(e) {

                e.preventDefault();

                e.stopPropagation();


                /*
                 * Explicitly use the bottom
                 * corner for the animation.
                 */

                flipbook.flipPrev("bottom");

            }
        );



        /* =================================
           KEYBOARD CONTROLS
        ================================= */

        document.addEventListener(
            "keydown",
            function(e) {


                if (
                    e.key === "ArrowRight"
                ) {

                    flipbook.flipNext("bottom");

                }


                if (
                    e.key === "ArrowLeft"
                ) {

                    flipbook.flipPrev("bottom");

                }

            }
        );


    }


    catch (error) {


        console.error(error);


        status.innerHTML =
            "Unable to load portfolio.";

    }

}



/* =====================================
   START
===================================== */

start();

</script>


</body>

</html>
