<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shamiha Sellamuthu — Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #f7f5f0;
            font-family: Arial, sans-serif;
            color: #333;
            overflow-x: hidden;
        }

        .viewer {
            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 25px 15px;
        }

        .title {
            font-size: 18px;
            color: #174f42;
            margin-bottom: 18px;
            letter-spacing: 0.2px;
        }

        #status {
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
        }

        #book {
            width: min(90vw, 1000px);
            height: min(75vh, 720px);

            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
        }

        .page {
            background: #fff;
            overflow: hidden;
            border-radius: 1px;
        }

        .page canvas {
            width: 100%;
            height: 100%;
            display: block;

            pointer-events: none;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 15px;
            margin-top: 20px;
        }

        button {
            border: none;

            background: #174f42;
            color: white;

            padding: 9px 17px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;

            transition:
                opacity 0.2s ease,
                transform 0.15s ease;
        }

        button:hover {
            opacity: 0.88;
        }

        button:active {
            transform: scale(0.97);
        }

        #pageNumber {
            min-width: 90px;

            text-align: center;

            font-size: 14px;

            color: #444;
        }

        @media (max-width: 700px) {

            .viewer {
                padding: 15px 8px;
            }

            .title {
                font-size: 15px;
            }

            #book {
                width: 94vw;
                height: 68vh;
            }

            button {
                padding: 8px 12px;
            }
        }
    </style>
</head>


<body>

    <div class="viewer">

        <div class="title">
            Flip through my portfolio
        </div>

        <div id="status">
            Loading portfolio...
        </div>

        <div id="book"></div>

        <div class="controls">

            <button id="prev">
                ← Previous
            </button>

            <span id="pageNumber">
                Page 1
            </span>

            <button id="next">
                Next →
            </button>

        </div>

    </div>


    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- PageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>


    <script>

        async function start() {

            const status =
                document.getElementById("status");

            const bookElement =
                document.getElementById("book");

            const pageNumber =
                document.getElementById("pageNumber");


            try {

                /* --------------------------------
                   PDF.JS WORKER
                -------------------------------- */

                pdfjsLib.GlobalWorkerOptions.workerSrc =
                    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


                /* --------------------------------
                   LOAD PDF
                -------------------------------- */

                const pdf =
                    await pdfjsLib
                        .getDocument("portfolio.pdf")
                        .promise;


                const pages = [];


                /* --------------------------------
                   CREATE PDF PAGES
                -------------------------------- */

                for (
                    let i = 1;
                    i <= pdf.numPages;
                    i++
                ) {

                    const pdfPage =
                        await pdf.getPage(i);


                    const viewport =
                        pdfPage.getViewport({
                            scale: 1.2
                        });


                    const canvas =
                        document.createElement("canvas");


                    const context =
                        canvas.getContext("2d");


                    canvas.width =
                        viewport.width;

                    canvas.height =
                        viewport.height;


                    await pdfPage.render({

                        canvasContext:
                            context,

                        viewport:
                            viewport

                    }).promise;


                    /* --------------------------------
                       CREATE PAGE ELEMENT
                    -------------------------------- */

                    const page =
                        document.createElement("div");


                    page.className =
                        "page";


                    /*
                     * FRONT + BACK
                     * = HARD DIARY COVER
                     */

                    if (
                        i === 1 ||
                        i === pdf.numPages
                    ) {

                        page.dataset.density =
                            "hard";

                    }

                    /*
                     * INSIDE PAGES
                     * = SOFT / THICK PAPER
                     */

                    else {

                        page.dataset.density =
                            "soft";

                    }


                    page.appendChild(canvas);

                    pages.push(page);

                }


                /* --------------------------------
                   HIDE LOADING
                -------------------------------- */

                status.style.display =
                    "none";


                /* --------------------------------
                   CREATE FLIPBOOK
                -------------------------------- */

                const flipbook =
                    new St.PageFlip(
                        bookElement,
                        {

                            width: 500,

                            height: 700,

                            size: "stretch",


                            minWidth: 280,

                            maxWidth: 600,


                            minHeight: 400,

                            maxHeight: 800,


                            /*
                             * Keeps the first
                             * and last pages
                             * as covers.
                             */

                            showCover: true,


                            /*
                             * Page shadow
                             *
                             * Reduced so the
                             * cover transition
                             * doesn't create
                             * a huge empty area.
                             */

                            drawShadow: true,

                            maxShadowOpacity: 0.04,


                            /*
                             * Slightly faster
                             * animation makes
                             * the cover transition
                             * feel smoother.
                             */

                            flippingTime: 520,


                            /*
                             * Allows the book
                             * to become portrait
                             * on smaller screens.
                             */

                            usePortrait: true,


                            /*
                             * Mobile scrolling.
                             */

                            mobileScrollSupport: true,


                            /*
                             * Easier mouse dragging.
                             */

                            useMouseEvents: true,


                            /*
                             * Smaller swipe distance
                             * means easier page turns.
                             */

                            swipeDistance: 20,


                            /*
                             * Clicking a page can
                             * also turn it.
                             */

                            disableFlipByClick: false

                        }
                    );


                /* --------------------------------
                   LOAD PAGES
                -------------------------------- */

                flipbook.loadFromHTML(pages);


                /* --------------------------------
                   PAGE NUMBER
                -------------------------------- */

                flipbook.on(
                    "flip",
                    function (e) {

                        pageNumber.textContent =
                            "Page " +
                            (e.data + 1) +
                            " / " +
                            pdf.numPages;

                    }
                );


                /* --------------------------------
                   NEXT BUTTON
                -------------------------------- */

                document
                    .getElementById("next")
                    .addEventListener(
                        "click",
                        function () {

                            flipbook.flipNext();

                        }
                    );


                /* --------------------------------
                   PREVIOUS BUTTON
                -------------------------------- */

                document
                    .getElementById("prev")
                    .addEventListener(
                        "click",
                        function () {

                            flipbook.flipPrev();

                        }
                    );


                /* --------------------------------
                   INITIAL PAGE NUMBER
                -------------------------------- */

                pageNumber.textContent =
                    "Page 1 / " +
                    pdf.numPages;


                /* --------------------------------
                   KEYBOARD CONTROLS
                -------------------------------- */

                document.addEventListener(
                    "keydown",
                    function (e) {

                        if (
                            e.key === "ArrowRight"
                        ) {

                            flipbook.flipNext();

                        }


                        if (
                            e.key === "ArrowLeft"
                        ) {

                            flipbook.flipPrev();

                        }

                    }
                );


            } catch (error) {

                console.error(error);

                status.innerHTML =
                    "Unable to load portfolio.";

            }

        }


        /* --------------------------------
           START FLIPBOOK
        -------------------------------- */

        start();

    </script>

</body>

</html>
