<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shamiha Sellamuthu — Portfolio</title>


    <style>

        /* =========================================
           GLOBAL
        ========================================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: transparent;
        }


        body {

            font-family: Arial, sans-serif;

            color: #333;

            overflow: hidden;
        }


        /* =========================================
           VIEWER
        ========================================= */

        .viewer {

            width: 100%;
            height: 100%;

            min-height: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: transparent;
        }


        /* =========================================
           FLIPBOOK
        ========================================= */

        #book {

            width: 90%;

            max-width: 1000px;

            height: 100%;

            max-height: 720px;

            touch-action: pan-y;

            user-select: none;

            -webkit-user-select: none;

            position: relative;

            z-index: 1;
        }


        /* =========================================
           PDF PAGE
        ========================================= */

        .page {

            position: relative;

            background: #fff;

            overflow: hidden;

            border-radius: 1px;
        }


        /* =========================================
           PDF CANVAS
        ========================================= */

        .page canvas {

            width: 100%;

            height: 100%;

            display: block;

            pointer-events: none;
        }


        /* =========================================
           CLICKABLE LINK — PAGE 7
        ========================================= */

        .clickable-link {

            position: absolute;

            z-index: 20;

            /*
             * Position of your "Be" link
             * on page 7.
             */

            left: 0%;

            top: 55%;

            width: 18%;

            height: 8%;

            display: block;

            background: transparent;

            cursor: pointer;

            text-decoration: none;

            pointer-events: auto;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            #book {

                width: 94%;

                height: 100%;

                max-height: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         VIEWER
    ========================================= -->

    <div class="viewer">

        <div id="book"></div>

    </div>



    <!-- =========================================
         PDF.JS
    ========================================= -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>



    <!-- =========================================
         PAGE FLIP
    ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>



    <script>


        async function start() {


            const bookElement =
                document.getElementById("book");


            try {


                /* =================================
                   PDF.JS WORKER
                ================================= */

                pdfjsLib.GlobalWorkerOptions.workerSrc =
                    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";



                /* =================================
                   LOAD PDF
                ================================= */

                const pdf =
                    await pdfjsLib
                        .getDocument("portfolio.pdf")
                        .promise;



                const pages = [];



                /* =================================
                   CREATE PDF PAGES
                ================================= */

                for (
                    let i = 1;
                    i <= pdf.numPages;
                    i++
                ) {


                    const pdfPage =
                        await pdf.getPage(i);



                    /* -----------------------------
                       PDF VIEWPORT
                    ----------------------------- */

                    const viewport =
                        pdfPage.getViewport({
                            scale: 1.2
                        });



                    /* -----------------------------
                       CREATE CANVAS
                    ----------------------------- */

                    const canvas =
                        document.createElement("canvas");


                    const context =
                        canvas.getContext("2d");


                    canvas.width =
                        viewport.width;


                    canvas.height =
                        viewport.height;



                    /* -----------------------------
                       RENDER PDF
                    ----------------------------- */

                    await pdfPage.render({

                        canvasContext:
                            context,

                        viewport:
                            viewport

                    }).promise;



                    /* -----------------------------
                       CREATE PAGE
                    ----------------------------- */

                    const page =
                        document.createElement("div");


                    page.className =
                        "page";



                    /* =================================
                       FRONT + BACK
                       HARD DIARY COVERS
                    ================================= */

                    if (
                        i === 1 ||
                        i === pdf.numPages
                    ) {

                        page.dataset.density =
                            "hard";

                    }


                    /* =================================
                       INSIDE PAGES
                       SOFT PAPER
                    ================================= */

                    else {

                        page.dataset.density =
                            "soft";

                    }



                    /* =================================
                       ADD PDF CANVAS
                    ================================= */

                    page.appendChild(canvas);



                    /* =================================
                       PAGE 7 CLICKABLE LINK
                    ================================= */

                    if (i === 7) {


                        const link =
                            document.createElement("a");


                        link.className =
                            "clickable-link";


                        link.href =
                            "https://shami1804.github.io/portfolio-flipbook/";


                        link.target =
                            "_blank";


                        link.rel =
                            "noopener noreferrer";



                        /* -----------------------------
                           STOP PAGE FLIP
                        ----------------------------- */

                        link.addEventListener(
                            "pointerdown",
                            function(e) {

                                e.stopPropagation();

                            }
                        );


                        link.addEventListener(
                            "pointerup",
                            function(e) {

                                e.stopPropagation();

                            }
                        );


                        link.addEventListener(
                            "mousedown",
                            function(e) {

                                e.stopPropagation();

                            }
                        );


                        link.addEventListener(
                            "mouseup",
                            function(e) {

                                e.stopPropagation();

                            }
                        );


                        link.addEventListener(
                            "click",
                            function(e) {

                                e.stopPropagation();

                            }
                        );


                        page.appendChild(link);

                    }



                    /* -----------------------------
                       SAVE PAGE
                    ----------------------------- */

                    pages.push(page);

                }



                /* =================================
                   CREATE FLIPBOOK
                ================================= */

                const flipbook =
                    new St.PageFlip(

                        bookElement,

                        {

                            /* -------------------------
                               BASE SIZE
                            ------------------------- */

                            width: 500,

                            height: 700,


                            /* -------------------------
                               STRETCH
                            ------------------------- */

                            size: "stretch",


                            /* -------------------------
                               SIZE LIMITS
                            ------------------------- */

                            minWidth: 280,

                            maxWidth: 600,


                            minHeight: 400,

                            maxHeight: 800,


                            /* -------------------------
                               DIARY COVER
                            ------------------------- */

                            showCover: true,


                            /* -------------------------
                               SHADOW
                            ------------------------- */

                            drawShadow: true,

                            maxShadowOpacity: 0.04,


                            /* -------------------------
                               ANIMATION
                            ------------------------- */

                            flippingTime: 520,


                            /* -------------------------
                               RESPONSIVE
                            ------------------------- */

                            usePortrait: true,


                            /* -------------------------
                               MOBILE SUPPORT
                            ------------------------- */

                            mobileScrollSupport: true,


                            /* -------------------------
                               MOUSE DRAGGING
                            ------------------------- */

                            useMouseEvents: true,


                            /* -------------------------
                               EASY DRAG
                            ------------------------- */

                            swipeDistance: 20,


                            /* -------------------------
                               CLICK TO FLIP
                            ------------------------- */

                            disableFlipByClick: false,


                            /* -------------------------
                               FORWARD LINK CLICKS
                            ------------------------- */

                            clickEventForward: true

                        }

                    );



                /* =================================
                   LOAD PAGES
                ================================= */

                flipbook.loadFromHTML(pages);


            }


            catch (error) {


                console.error(
                    "Flipbook error:",
                    error
                );


            }

        }



        /* =========================================
           START
        ========================================= */

        start();


    </script>


</body>

</html>
