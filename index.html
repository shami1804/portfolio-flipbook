<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shamiha Sellamuthu — Portfolio</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }


        body {

            background: #f7f5f0;

            font-family: Arial, sans-serif;

            color: #333;

            overflow-x: hidden;
        }


        /* =================================
           MAIN VIEWER
        ================================= */

        .viewer {

            width: 100%;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px 15px;
        }


        /* =================================
           FLIPBOOK
        ================================= */

        #book {

            width: min(90vw, 1000px);

            height: min(75vh, 720px);

            touch-action: pan-y;

            user-select: none;

            -webkit-user-select: none;

            position: relative;

            z-index: 1;
        }


        /* =================================
           PAGE
        ================================= */

        .page {

            position: relative;

            background: #fff;

            overflow: hidden;

            border-radius: 1px;
        }


        /* =================================
           PDF CANVAS
        ================================= */

        .page canvas {

            width: 100%;

            height: 100%;

            display: block;

            pointer-events: none;
        }


        /* =================================
           CLICKABLE LINK ON PAGE 7
        ================================= */

        .clickable-link {

            position: absolute;

            z-index: 20;

            left: 0%;

            top: 55%;

            width: 18%;

            height: 8%;

            display: block;

            background: transparent;

            cursor: pointer;

            text-decoration: none;

            pointer-events: auto;
        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 700px) {

            .viewer {

                padding: 15px 8px;
            }


            #book {

                width: 94vw;

                height: 68vh;
            }

        }

    </style>

</head>


<body>


<div class="viewer">


    <div id="book"></div>


</div>



<!-- =====================================
     PDF.JS
===================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>



<!-- =====================================
     PAGE FLIP
===================================== -->

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>



<script>


async function start() {


    const bookElement =
        document.getElementById("book");


    try {


        /* =================================
           PDF.JS WORKER
        ================================= */

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";



        /* =================================
           LOAD PDF
        ================================= */

        const pdf =
            await pdfjsLib
                .getDocument("portfolio.pdf")
                .promise;



        const pages = [];



        /* =================================
           CREATE PDF PAGES
        ================================= */

        for (
            let i = 1;
            i <= pdf.numPages;
            i++
        ) {


            const pdfPage =
                await pdf.getPage(i);



            const viewport =
                pdfPage.getViewport({
                    scale: 1.2
                });



            /* -----------------------------
               CREATE CANVAS
            ----------------------------- */

            const canvas =
                document.createElement("canvas");


            const context =
                canvas.getContext("2d");


            canvas.width =
                viewport.width;


            canvas.height =
                viewport.height;



            /* -----------------------------
               RENDER PDF
            ----------------------------- */

            await pdfPage.render({

                canvasContext:
                    context,

                viewport:
                    viewport

            }).promise;



            /* -----------------------------
               CREATE PAGE
            ----------------------------- */

            const page =
                document.createElement("div");


            page.className =
                "page";



            /* =================================
               FRONT + BACK = HARD COVER
            ================================= */

            if (
                i === 1 ||
                i === pdf.numPages
            ) {

                page.dataset.density =
                    "hard";

            }


            /* =================================
               INSIDE = SOFT PAPER
            ================================= */

            else {

                page.dataset.density =
                    "soft";

            }



            /* =================================
               ADD PDF
            ================================= */

            page.appendChild(canvas);



            /* =================================
               PAGE 7 CLICKABLE LINK
            ================================= */

            if (i === 7) {


                const link =
                    document.createElement("a");


                link.className =
                    "clickable-link";


                link.href =
                    "https://shami1804.github.io/portfolio-flipbook/";


                link.target =
                    "_blank";


                link.rel =
                    "noopener noreferrer";


                /* -----------------------------
                   STOP PAGE FLIP
                ----------------------------- */

                link.addEventListener(
                    "pointerdown",
                    function(e) {

                        e.stopPropagation();

                    }
                );


                link.addEventListener(
                    "pointerup",
                    function(e) {

                        e.stopPropagation();

                    }
                );


                link.addEventListener(
                    "mousedown",
                    function(e) {

                        e.stopPropagation();

                    }
                );


                link.addEventListener(
                    "mouseup",
                    function(e) {

                        e.stopPropagation();

                    }
                );


                link.addEventListener(
                    "click",
                    function(e) {

                        e.stopPropagation();

                    }
                );


                page.appendChild(link);

            }



            pages.push(page);

        }



        /* =================================
           CREATE FLIPBOOK
        ================================= */

        const flipbook =
            new St.PageFlip(

                bookElement,

                {

                    width: 500,

                    height: 700,


                    size: "stretch",


                    minWidth: 280,

                    maxWidth: 600,


                    minHeight: 400,

                    maxHeight: 800,


                    /* =========================
                       DIARY COVER
                    ========================= */

                    showCover: true,


                    /* =========================
                       SHADOW
                    ========================= */

                    drawShadow: true,

                    maxShadowOpacity: 0.04,


                    /* =========================
                       SMOOTH ANIMATION
                    ========================= */

                    flippingTime: 520,


                    /* =========================
                       RESPONSIVE
                    ========================= */

                    usePortrait: true,


                    /* =========================
                       MOBILE
                    ========================= */

                    mobileScrollSupport: true,


                    /* =========================
                       MOUSE DRAG
                    ========================= */

                    useMouseEvents: true,


                    /* =========================
                       EASY DRAG
                    ========================= */

                    swipeDistance: 20,


                    /* =========================
                       CLICK TO FLIP
                    ========================= */

                    disableFlipByClick: false,


                    /* =========================
                       LINKS
                    ========================= */

                    clickEventForward: true

                }

            );



        /* =================================
           LOAD PAGES
        ================================= */

        flipbook.loadFromHTML(pages);


    }


    catch (error) {

        console.error(error);

    }

}



/* =====================================
   START
===================================== */

start();

</script>


</body>

</html>
